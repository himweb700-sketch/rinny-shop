<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rinny Shop Admin 🌷</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;color:#503746;background:linear-gradient(135deg,#fff4fa,#eefaff)}.wrap{max-width:1100px;margin:auto;padding:20px}
</style></head><body><main class="wrap"><header class="top"><div class="logo">🐱</div><div><b>Rinny Shop</b><br><small>Admin Dashboard 🌷</small></div><div class="spacer"></div><a class="btn blue" href="/">ไปที่ร้าน</a></header>
<section class="cards"><div class="stat">🛍️<div class="num" id="orders">-</div><div class="muted">ออเดอร์</div></div><div class="stat">💰<div class="num" id="sales">-</div><div class="muted">ยอดขาย</div></div><div class="stat">👥<div class="num" id="customers">-</div><div class="muted">ลูกค้า</div></div><div class="stat">⏳<div class="num" id="pending">-</div><div class="muted">รอจ่าย</div></div></section>
<div class="layout"><section class="panel"><h2>🧾 ออเดอร์ล่าสุด</h2><div id="orderList">กำลังโหลด...</div></section>
<section class="panel"><h2>🎀 จัดการสินค้า</h2><input class="field" id="name" placeholder="ชื่อสินค้า"><input class="field" id="desc" placeholder="รายละเอียด"><input class="field" id="price" placeholder="ราคา"><input class="field" id="icon" placeholder="ไอคอน (เช่น ✨)"><button class="btn" onclick="addProduct()">เพิ่มสินค้า</button><div id="products">กำลังโหลด...</div>
</section>
</div>
<script>
async function api(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function init(){const m=await api("/api/me");if(!m.admin){alert("หน้านี้สำหรับแอดมินเท่านั้น 😾");location.href="/";return}await stats();await orders();await products();document.querySelector('#logout')?.addEventListener('click',logout)}
async function stats(){const s=await api("/api/admin/stats");for(const [k,v] of Object.entries(s)){const e=document.querySelector("#"+k);if(e)e.textContent=k==="sales"?Number(v).toLocaleString()+" ฿":v}}
async function orders(){const os=await api("/api/admin/orders");document.querySelector("#orderList").innerHTML=os.length?os.map(o=>`<div class="order"><div class="grow"><b>#${o.id} ${o.product_name}</b><div class="muted">โดย ${o.username} — ${new Date(o.created_at).toLocaleString()}</div></div><div class="status"><select onchange="status(${o.id},this.value)"><option value="pending">รอตรวจสอบ</option><option value="paid">ชำระแล้ว</option><option value="processing">กำลังดำเนินการ</option><option value="completed">เสร็จแล้ว</option><option value="cancelled">ยกเลิก</option></select></div></div>`).join(''):'ยังไม่มีออเดอร์'}
async function status(id,s){await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})});stats()}
async function products(){const ps=await api("/api/products");document.querySelector("#products").innerHTML=ps.map(p=>`<div class="product"><div class="row"><input class="field" id="n${p.id}" value="${p.name}"></div><div class="row"><input class="field" id="d${p.id}" value="${p.description}"></div><div class="row"><input class="field" id="pr${p.id}" value="${p.price}"></div><div class="row"><input class="field" id="ic${p.id}" value="${p.icon}"></div><div class="row"><button class="btn" onclick="edit(${p.id})">บันทึก</button> <button class="btn" onclick="del(${p.id})">ลบ</button></div></div>`).join('')}
async function addProduct(){const body={name:document.querySelector('#name').value.trim(),description:document.querySelector('#desc').value.trim(),price:Number(document.querySelector('#price').value),icon:document.querySelector('#icon').value||"✨"};if(!body.name)return alert('ต้องใส่ชื่อสินค้า');await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.querySelector('#name').value='';products()}
async function edit(id){await api('/api/admin/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#n'+id).value,description:document.querySelector('#d'+id).value,price:Number(document.querySelector('#pr'+id).value),icon:document.querySelector('#ic'+id).value})});products()}
async function del(id){if(confirm('ลบสินค้านี้ไหม 🥺')){await api('/api/admin/products/'+id,{method:'DELETE'});products()}}
async function logout(){await api('/auth/logout',{method:'POST'});location.href='/'}function label(s){return({pending:"รอตรวจสอบ",paid:"ชำระแล้ว",processing:"กำลังดำเนินการ",completed:"เสร็จแล้ว",cancelled:"ยกเลิก"}[s]||s)}

init();
</script></body></html>
