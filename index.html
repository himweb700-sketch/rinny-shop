<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rinny Shop 💗</title>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;color:#503746;background:linear-gradient(135deg,#fff4fa,#edfaff)}nav{background:#ffffffdd;backdrop-filter:blur(12px);padding:12px 18px;position:sticky;top:0;z-index:3;border-bottom:2px solid #f2dce6}.nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,#ffafd0,#bce8ff);display:grid;place-items:center;font-size:25px}.brand{font-weight:1000;font-size:20px}.spacer{margin-left:auto}.btn{border:0;border-radius:15px;padding:11px 15px;font-weight:900;cursor:pointer;background:#ff91bb;color:#fff}.btn.blue{background:#8ccdf5}.btn.white{background:#fff;color:#5a4450}.wrap{max-width:1100px;margin:auto;padding:45px 18px}.hero{text-align:center;padding:20px 0 35px}.hero h1{font-size:clamp(40px,7vw,70px);margin:15px 0 8px}.grad{background:linear-gradient(90deg,#ff629f,#8b80ff);color:transparent;background-clip:text}.hero p{font-size:18px;color:#7b6871}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:#fff;border:2px solid #f1dbe5;border-radius:25px;padding:18px;box-shadow:0 10px 25px #9e708522}.thumb{height:145px;border-radius:19px;background:linear-gradient(135deg,#ffe7f1,#e4f6ff);display:grid;place-items:center;font-size:70px}.card h2{margin:13px 0 5px}.desc{color:#7e6c75;min-height:46px;line-height:1.5}.row{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.price{font-size:21px;font-weight:1000}.loginbox{text-align:center;background:#fff;border:2px dashed #e7c6d8;border-radius:22px;padding:20px;margin:20px 0}.user{font-weight:900}.status{color:#8a7680}@media(max-width:700px){.grid{grid-template-columns:1fr}.nav .brand{font-size:17px}}
</style></head><body>
<nav><div class="nav"><div class="logo">🐱</div><div class="brand">Rinny Shop</div><div class="spacer"></div><span id="user" class="user"></span><button id="login" class="btn">💜 เข้าสู่ระบบด้วย Discord</button><button id="logout" class="btn white" style="display:none">ออกจากระบบ</button></div></nav>
<main class="wrap"><section class="hero"><div style="font-size:55px">🌸🐱🌸</div><h1>Rinny <span class="grad">Shop</span></h1><p>ร้าน Discord ของริน — น่ารัก ใช้ง่าย และสั่งซื้อได้ในไม่กี่คลิก 💗</p></section>
<div class="loginbox"><b>🔐 ระบบสมาชิก</b><div class="status">เข้าสู่ระบบด้วย Discord เพื่อสั่งซื้อและดูประวัติออเดอร์ของตัวเอง</div></div>
<h2>🛍️ สินค้า</h2><section class="grid" id="products"></section></main>
<script>
let me=null;
const $=s=>document.querySelector(s);
async function api(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw new Error(d.error||"เกิดข้อผิดพลาด");return d}
async function init(){const m=await api("/api/me");me=m.user;$("#user").textContent=me?`💗 ${me.global_name||me.username}`:"";$("#login").style.display=me?"none":"block";$("#logout").style.display=me?"block":"none";if(m.admin)$("#user").insertAdjacentHTML("afterend",' <a class="btn blue" href="/admin.html" style="text-decoration:none">🌷 Admin</a>');render()}
async function render(){const ps=await api("/api/products");$("#products").innerHTML=ps.map(p=>`<article class="card"><div class="thumb">${p.icon}</div><h2>${esc(p.name)}</h2><div class="desc">${esc(p.description)}</div><div class="row"><span class="price">฿${Number(p.price).toLocaleString()}</span><button class="btn" onclick="buy(${p.id})">ซื้อเลย 💗</button></div></article>`).join("")}
async function buy(id){if(!me){location.href="/auth/discord";return}try{const o=await api("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({productId:id})});alert("สร้างออเดอร์ #"+o.orderId+" แล้ว 💗\\nกด OK เพื่อเข้าดิสคุยกับร้าน");location.href=o.discordInvite}catch(e){alert(e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
$("#login").onclick=()=>location.href="/auth/discord";$("#logout").onclick=async()=>{await api("/auth/logout",{method:"POST"});location.reload()};init();
</script></body></html>
