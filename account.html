<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัญชีของฉัน — Rinny Shop</title>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<style>body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:linear-gradient(135deg,#fff4fa,#eefaff);color:#503746}.wrap{max-width:850px;margin:auto;padding:30px 16px}.head,.order{background:#fff;border:2px solid #f0dce6;border-radius:23px;padding:20px;box-shadow:0 9px 25px #9e70851c}.head{margin-bottom:15px}.order{display:flex;align-items:center;gap:12px;margin:10px 0}.avatar{font-size:30px}.grow{flex:1}.pill{padding:7px 10px;border-radius:999px;background:#fff0a9;font-weight:900}.btn{border:0;border-radius:14px;padding:10px 14px;background:#ff91bb;color:#fff;font-weight:900;cursor:pointer}.back{color:#71465b;text-decoration:none;font-weight:900}</style></head><body><main class="wrap"><a class="back" href="/">← กลับหน้าร้าน</a><div class="head"><h1>🌷 บัญชีของฉัน</h1><p id="me">กำลังโหลด...</p><button class="btn" onclick="logout()">ออกจากระบบ</button></div><h2>🧾 ออเดอร์ของฉัน</h2><div id="orders">กำลังโหลด...</div></main><script>
async function api(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function init(){const m=await api("/api/me");if(!m.user){location.href="/";return}document.querySelector("#me").textContent=`เข้าสู่ระบบเป็น ${m.user.global_name||m.user.username}`;const os=await api("/api/my-orders");document.querySelector("#orders").innerHTML=os.length?os.map(o=>`<div class="order"><div class="avatar">🛍️</div><div class="grow"><b>#${o.id} — ${o.product_name}</b><br><small>฿${Number(o.price).toLocaleString()} • ${new Date(o.created_at).toLocaleString("th-TH")}</small></div><span class="pill">${label(o.status)}</span></div>`).join(""):"ยังไม่มีออเดอร์น้า 💗"}function label(s){return ({pending:"รอตรวจสอบ",paid:"ชำระแล้ว",processing:"กำลังดำเนินการ",completed:"เสร็จแล้ว",cancelled:"ยกเลิก"})[s]||s}async function logout(){await api("/auth/logout",{method:"POST"});location.href="/"}init();
</script></body></html>
