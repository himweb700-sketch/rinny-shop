name: CI - test invite

on:
  push:
    branches:
      - feat/bot-invite
  pull_request:
    branches:
      - main

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js

      - name: Start server
        run: |
          nohup node server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
        env:
          DISCORD_CLIENT_ID: 123456789012345678
          DISCORD_CLIENT_SECRET: dummy
          DISCORD_REDIRECT_URI: http://localhost:3000/auth/discord/callback
          SESSION_SECRET: ci-test-secret
          ADMIN_DISCORD_IDS: 1533794186241773775
          DISCORD_BOT_PERMISSIONS: 0

      - name: Wait for server
        run: |
          for i in {1..15}; do
            if curl -sSf http://localhost:3000/ >/dev/null 2>&1; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done

          echo "Server failed to start"
          cat /tmp/server.log
          exit 1

      - name: Test invite redirect
        run: |
          set -e

          HEADERS=$(curl -i -sS \
            "http://localhost:3000/invite/bot?permissions=8")

          echo "$HEADERS"

          echo "$HEADERS" | grep -E \
            "HTTP/1.1 302|HTTP/2 302"

          echo "$HEADERS" | grep -i "Location:"

          echo "$HEADERS" | grep \
            "client_id=123456789012345678"

          echo "$HEADERS" | grep -E \
            "scope=bot(\+|%20)applications.commands"

          echo "$HEADERS" | grep \
            "permissions=8"

      - name: Test basic routes
        run: |
          curl -sSf http://localhost:3000/ >/dev/null
          curl -sSf http://localhost:3000/admin.html >/dev/null
          curl -sSf http://localhost:3000/api/products >/dev/null

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill "$(cat /tmp/server.pid)" || true
          fi
